          value: '{{DLV - event_attributes.page_template}}'
        - name: plan_name
          value: '{{DLV - event_attributes.plan_name}}'
        - name: platform
          value: '{{DLV - event_attributes.platform}}'
        - name: search_filters
          value: '{{DLV - event_attributes.search_filters}}'
        - name: search_results_count
          value: '{{DLV - event_attributes.search_results_count}}'
        - name: search_term
          value: '{{DLV - event_attributes.search_term}}'
        - name: site_language
          value: '{{DLV - event_attributes.site_language}}'
        - name: sort_order
          value: '{{DLV - event_attributes.sort_order}}'
        - name: user_logged_in
          value: '{{DLV - event_attributes.user_logged_in}}'
        - name: wishlist_id
          value: '{{DLV - event_attributes.wishlist_id}}'
