name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/tiggy-cli
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Tag matches the package version
        run: |
          version=$(uv version --short)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi

      - run: uv build

      - name: Smoke-test the wheel
        run: |
          tiggy() { uv run --isolated --no-project --with dist/*.whl tiggy "$@"; }
          tiggy --version
          tiggy import tests/fixtures/cdm/web_analytics.json "$RUNNER_TEMP/spec"
          tiggy import tests/fixtures/cdm/web_analytics.json "$RUNNER_TEMP/spec" --check

      - run: uv publish
